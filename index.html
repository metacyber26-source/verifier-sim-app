<!-- Bagian Pilihan Skala Tingkat Kepuasan / Kelayakan -->
<div class="weight-box">
    <div class="weight-label-row">
        <span>TINGKAT KEPUASAN / KELAYAKAN:</span>
        <span class="weight-num" id="weight-display">3 - LAYAK / PUAS</span>
    </div>
    <div class="weight-selector">
        <button class="btn-weight" onclick="setWeight(1)">1</button>
        <button class="btn-weight" onclick="setWeight(2)">2</button>
        <button class="btn-weight active" onclick="setWeight(3)">3</button>
        <button class="btn-weight" onclick="setWeight(4)">4</button>
        <button class="btn-weight" onclick="setWeight(5)">5</button>
    </div>
    <div class="weight-hint">
        <small id="weight-hint-text">Skala 3: Memenuhi standar verifikasi umum</small>
    </div>
</div>
