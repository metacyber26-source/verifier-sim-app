<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifier & Validator Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <i data-lucide="shield-check" class="brand-icon"></i>
                <span class="brand-title">VerifierSim Community</span>
            </div>
            <div class="stats-badge">
                <div class="stat-item">
                    <i data-lucide="zap" class="icon-gold"></i>
                    <span id="score-val">0</span> XP
                </div>
                <div class="stat-item">
                    <i data-lucide="award" class="icon-purple"></i>
                    Lvl <span id="level-val">1</span>
                </div>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="progress-bar-wrapper">
            <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="meta-row">
                <span class="badge badge-category" id="case-category">Komunitas Mode</span>
                <span class="badge badge-level" id="case-level-tag">Level -</span>
            </div>

            <!-- Card View -->
            <div class="card case-card">
                <h2 id="case-title" class="case-title">Simulator Verifikasi Komunitas</h2>
                <p id="case-desc" class="case-desc">Klik tombol di bawah untuk membuat 10 skenario simulasi verifikasi baru lintas bidang hari ini.</p>
                
                <div class="document-viewer" id="doc-viewer">
                    <p style="text-align: center; color: var(--text-secondary); padding: 10px;">Tekan tombol di bawah untuk memulai.</p>
                </div>
            </div>

            <!-- Generator Button -->
            <button class="btn btn-ai-generate" id="btn-generate" onclick="generateDailyCases()">
                <i data-lucide="sparkles"></i>
                Generate 10 Kasus Hari Ini
            </button>

            <!-- Action Buttons -->
            <div class="action-buttons hidden" id="action-area">
                <button class="btn btn-reject" onclick="handleDecision('reject')">
                    <i data-lucide="x-circle"></i>
                    TOLAK (REJECT)
                </button>
                <button class="btn btn-approve" onclick="handleDecision('approve')">
                    <i data-lucide="check-circle"></i>
                    SETUJU (APPROVE)
                </button>
            </div>

            <!-- Feedback Card -->
            <div class="card feedback-card hidden" id="feedback-card">
                <div class="feedback-header">
                    <i id="feedback-icon" data-lucide="info"></i>
                    <h3 id="feedback-title">Hasil Keputusan</h3>
                </div>
                <p id="feedback-text" class="feedback-text"></p>
                
                <div class="feedback-details">
                    <span class="detail-label">Analisis Verifikator:</span>
                    <p id="feedback-reason" class="reason-text"></p>
                </div>

                <button class="btn btn-next" onclick="nextCase()">
                    Kasus Selanjutnya
                    <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
