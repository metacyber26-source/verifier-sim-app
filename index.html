<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifier & Validator Simulator</title>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Header / Top Bar -->
        <header class="app-header">
            <div class="brand">
                <i data-lucide="shield-check" class="brand-icon"></i>
                <span class="brand-title">VerifierSim</span>
            </div>
            <div class="stats-badge">
                <div class="stat-item">
                    <i data-lucide="zap" class="icon-gold"></i>
                    <span id="score-val">0</span> XP
                </div>
                <div class="stat-item">
                    <i data-lucide="award" class="icon-purple"></i>
                    Level <span id="level-val">1</span>
                </div>
            </div>
        </header>

        <!-- Progress Bar Baris Atas -->
        <div class="progress-bar-wrapper">
            <div class="progress-bar-fill" id="progress-fill" style="width: 10%;"></div>
        </div>

        <!-- Main Card Case Container -->
        <main class="main-content">
            <!-- Category & Difficulty Pill -->
            <div class="meta-row">
                <span class="badge badge-category" id="case-category">Kategori</span>
                <span class="badge badge-level" id="case-level-tag">Level 1</span>
            </div>

            <!-- Case Title & Description -->
            <div class="card case-card">
                <h2 id="case-title" class="case-title">Loading Kasus...</h2>
                <p id="case-desc" class="case-desc">Detail skenario akan muncul di sini.</p>
                
                <!-- Document / Data Viewer (Interaktif) -->
                <div class="document-viewer" id="doc-viewer">
                    <!-- Dynamic Document Data Rendered via JS -->
                </div>
            </div>

            <!-- Decision Buttons -->
            <div class="action-buttons" id="action-area">
                <button class="btn btn-reject" onclick="handleDecision('reject')">
                    <i data-lucide="x-circle"></i>
                    TOLAK (REJECT)
                </button>
                <button class="btn btn-approve" onclick="handleDecision('approve')">
                    <i data-lucide="check-circle"></i>
                    SETUJU (APPROVE)
                </button>
            </div>

            <!-- Feedback / Result Section (Hidden Initially) -->
            <div class="card feedback-card hidden" id="feedback-card">
                <div class="feedback-header" id="feedback-header">
                    <i id="feedback-icon" data-lucide="info"></i>
                    <h3 id="feedback-title">Hasil Keputusan</h3>
                </div>
                <p id="feedback-text" class="feedback-text"></p>
                
                <div class="feedback-details">
                    <span class="detail-label">Analisis Verifikator:</span>
                    <p id="feedback-reason" class="reason-text"></p>
                </div>

                <button class="btn btn-next" onclick="nextCase()">
                    Kasus Selanjutnya
                    <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
